name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify & Build APK
        run: |
          echo "=== Repository Contents ==="
          ls -la
          
          # Locate pubspec.yaml
          if [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          else
            TARGET_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          fi

          if [ -z "$TARGET_DIR" ]; then
            echo "❌ ERROR: No pubspec.yaml found! Please upload the project files from ExpenseFlow_GitHub_Ready_Package.zip."
            exit 1
          fi

          echo "✅ Found project in directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Prepare assets
          mkdir -p assets/lottie
          touch assets/lottie/.gitkeep

          # Configure Android platform
          flutter create . --platforms=android --org=com.example

          # Get dependencies
          flutter pub get

          # Build release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseFlow-Release-APK
          path: '**/build/app/outputs/flutter-apk/*.apk'
